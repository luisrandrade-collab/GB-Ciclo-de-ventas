<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="description" content="Catálogo de Gourmet Bites by Andrade Matuk — catering libanés y mediterráneo en Bogotá. Mezza, principales, pastelería, postres y eventos.">
<title>Catálogo · Gourmet Bites by Andrade Matuk</title>
<link rel="icon" type="image/png" href="brand/Logo Gourmet Bites - Vertical.png">

<style>
  :root {
    --gb-primary: #1B5E20;
    --gb-accent: #C9A96E;
    --gb-bg: #FAF8F4;
    --gb-card: #FFFFFF;
    --gb-text: #1A1A1A;
    --gb-text-muted: #6B6B6B;
    --gb-border: #E5DFD3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--gb-bg);
    color: var(--gb-text);
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    background: var(--gb-card);
    border-bottom: 1px solid var(--gb-border);
    padding: 24px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  header img { max-width: 200px; height: auto; }
  header h1 {
    margin: 8px 0 4px;
    font-size: 22px;
    font-weight: 600;
    color: var(--gb-primary);
    letter-spacing: 0.5px;
  }
  header .tagline { color: var(--gb-text-muted); font-size: 13px; margin: 0; font-style: italic; }
  header .contact {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 13px;
  }
  header .contact a {
    color: var(--gb-primary);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  header .contact a:hover { text-decoration: underline; }

  /* Filtros */
  .filtros {
    max-width: 1200px;
    margin: 16px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-wrap: wrap;
  }
  .filtros button {
    padding: 8px 16px;
    border: 1px solid var(--gb-border);
    background: var(--gb-card);
    color: var(--gb-text);
    border-radius: 24px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: all .15s;
  }
  .filtros button:hover { border-color: var(--gb-primary); }
  .filtros button.active {
    background: var(--gb-primary);
    color: #fff;
    border-color: var(--gb-primary);
  }

  /* Main */
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--gb-text-muted);
    font-size: 14px;
  }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--gb-text-muted);
  }

  .categoria { margin-bottom: 40px; }
  .categoria h2 {
    color: var(--gb-primary);
    border-bottom: 2px solid var(--gb-accent);
    padding-bottom: 8px;
    margin: 0 0 16px;
    font-size: 20px;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--gb-card);
    border: 1px solid var(--gb-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  .card .foto {
    width: 100%;
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #F5EFE0, #E5DFD3);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gb-accent);
    font-size: 32px;
  }
  .card .body { padding: 12px 14px; }
  .card .nombre {
    font-size: 14.5px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--gb-text);
    line-height: 1.3;
  }
  .card .desc {
    font-size: 12.5px;
    color: var(--gb-text-muted);
    margin: 0 0 8px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .precio {
    font-size: 14px;
    font-weight: 700;
    color: var(--gb-primary);
  }
  .card .unidad {
    font-size: 11px;
    color: var(--gb-text-muted);
    font-weight: normal;
    margin-left: 4px;
  }

  /* Modal foto grande */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: pointer;
  }
  .modal.show { display: flex; }
  .modal img {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
  }
  .modal-info {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,.95);
    padding: 12px 20px;
    border-radius: 8px;
    text-align: center;
    max-width: 90%;
  }
  .modal-info h3 { margin: 0 0 4px; font-size: 16px; color: var(--gb-primary); }
  .modal-info p { margin: 0; font-size: 13px; color: var(--gb-text-muted); }

  /* Footer */
  footer {
    background: var(--gb-card);
    border-top: 1px solid var(--gb-border);
    padding: 24px 16px;
    text-align: center;
    color: var(--gb-text-muted);
    font-size: 12px;
  }
  footer p { margin: 4px 0; }

  @media (max-width: 600px) {
    header img { max-width: 140px; }
    header h1 { font-size: 18px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card .nombre { font-size: 13.5px; }
    .filtros { padding: 0 12px; }
    .filtros button { padding: 6px 12px; font-size: 12px; }
  }
</style>
</head>

<body>

<header>
  <img src="brand/Logo Gourmet Bites - Vertical.png" alt="Gourmet Bites by Andrade Matuk" onerror="this.style.display='none'">
  <h1>Gourmet Bites by Andrade Matuk</h1>
  <p class="tagline">Catering libanés y mediterráneo · Bogotá</p>
  <div class="contact">
    <a href="https://wa.me/573104441588" target="_blank">📱 WhatsApp +57 310 444 1588</a>
    <a href="https://instagram.com/gourmetbitesbyandradematuk" target="_blank">📸 @gourmetbitesbyandradematuk</a>
  </div>
</header>

<div class="filtros" id="filtros">
  <button class="active" data-cat="">Todos</button>
</div>

<main>
  <div id="loading" class="loading">Cargando catálogo...</div>
  <div id="contenido"></div>
</main>

<div class="modal" id="modal" onclick="this.classList.remove('show')">
  <img id="modal-img" src="" alt="">
  <div class="modal-info" id="modal-info"></div>
</div>

<footer>
  <p><strong>Gourmet Bites by Andrade Matuk</strong></p>
  <p>Para pedidos: <a href="https://wa.me/573104441588">WhatsApp +57 310 444 1588</a></p>
  <p>Catálogo actualizado en tiempo real desde nuestro sistema</p>
</footer>

<script>
const FIREBASE_PROJECT = "gourmet-bites-cotizador";
const FIREBASE_API_KEY = "AIzaSyDnOAMf2Vu7ydnjBpSQkmvwOi0QCPhU6Xc";
const BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

// Decodifica un value Firestore al tipo JS nativo
function fromFirestore(field) {
  if (!field) return null;
  if ("stringValue" in field) return field.stringValue;
  if ("integerValue" in field) return parseInt(field.integerValue, 10);
  if ("doubleValue" in field) return field.doubleValue;
  if ("booleanValue" in field) return field.booleanValue;
  if ("nullValue" in field) return null;
  if ("arrayValue" in field) return (field.arrayValue.values || []).map(fromFirestore);
  if ("mapValue" in field) {
    const out = {};
    for (const [k, v] of Object.entries(field.mapValue.fields || {})) out[k] = fromFirestore(v);
    return out;
  }
  return null;
}

function decodeDoc(doc) {
  const out = {id: doc.name.split("/").pop()};
  for (const [k, v] of Object.entries(doc.fields || {})) out[k] = fromFirestore(v);
  return out;
}

function fmt(n) {
  if (!n || n === 0) return "Consultar";
  return "$" + n.toLocaleString("es-CO");
}

let allProductos = [];
let allCategorias = [];
let activeCat = "";

async function fetchAll(coll) {
  const out = [];
  let pageToken = null;
  for (let i = 0; i < 5; i++) {
    let url = `${BASE}/${coll}?key=${FIREBASE_API_KEY}&pageSize=300`;
    if (pageToken) url += `&pageToken=${pageToken}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status} en ${coll}`);
    const d = await r.json();
    (d.documents || []).forEach(doc => out.push(decodeDoc(doc)));
    if (!d.nextPageToken) break;
    pageToken = d.nextPageToken;
  }
  return out;
}

function render() {
  const cont = document.getElementById("contenido");
  const filtroVisible = activeCat === "" ? null : activeCat;
  const cats = allCategorias
    .filter(c => c.activo !== false)
    .filter(c => !filtroVisible || c.categoriaId === filtroVisible)
    .sort((a, b) => (a.orden || 9999) - (b.orden || 9999));

  const html = [];
  let totalProductos = 0;
  for (const cat of cats) {
    const prods = allProductos
      .filter(p => p.activo !== false && p.categoriaId === cat.categoriaId)
      .sort((a, b) => (a.ordenDentroDeCategoria || 9999) - (b.ordenDentroDeCategoria || 9999));
    if (prods.length === 0) continue;
    totalProductos += prods.length;

    html.push(`<div class="categoria"><h2>${escapeHtml(cat.nombre)}</h2><div class="grid">`);
    for (const p of prods) {
      const fotoStyle = p.fotoUrl
        ? `background-image: url('${p.fotoUrl}')`
        : ``;
      const placeholder = p.fotoUrl ? "" : "🍽️";
      html.push(`
        <div class="card" onclick="abrirModal('${escapeAttr(p.id)}')">
          <div class="foto" style="${fotoStyle}">${placeholder}</div>
          <div class="body">
            <p class="nombre">${escapeHtml(p.nombre || "")}</p>
            ${p.descripcion ? `<p class="desc">${escapeHtml(p.descripcion)}</p>` : ""}
            <div class="precio">${fmt(p.precio)}<span class="unidad">${escapeHtml(p.unidad || "")}</span></div>
          </div>
        </div>
      `);
    }
    html.push(`</div></div>`);
  }

  if (totalProductos === 0) {
    cont.innerHTML = `<div class="empty">Sin productos en esta categoría.</div>`;
  } else {
    cont.innerHTML = html.join("");
  }
}

function abrirModal(productId) {
  const p = allProductos.find(x => x.id === productId);
  if (!p || !p.fotoUrl) return;
  document.getElementById("modal-img").src = p.fotoUrl;
  document.getElementById("modal-info").innerHTML = `
    <h3>${escapeHtml(p.nombre)}</h3>
    ${p.descripcion ? `<p>${escapeHtml(p.descripcion)}</p>` : ""}
    <p style="margin-top:6px"><strong>${fmt(p.precio)}</strong> <span style="color:#999">${escapeHtml(p.unidad || "")}</span></p>
  `;
  document.getElementById("modal").classList.add("show");
}

function renderFiltros() {
  const filtros = document.getElementById("filtros");
  // Solo categorías que tienen productos visibles
  const cats = allCategorias
    .filter(c => c.activo !== false)
    .filter(c => allProductos.some(p => p.activo !== false && p.categoriaId === c.categoriaId))
    .sort((a, b) => (a.orden || 9999) - (b.orden || 9999));
  // Limpiar filtros excepto el "Todos" inicial
  filtros.innerHTML = `<button class="${activeCat === "" ? "active" : ""}" data-cat="">Todos</button>`;
  for (const cat of cats) {
    const btn = document.createElement("button");
    btn.textContent = cat.nombre;
    btn.dataset.cat = cat.categoriaId;
    if (cat.categoriaId === activeCat) btn.classList.add("active");
    btn.onclick = () => {
      activeCat = cat.categoriaId;
      renderFiltros();
      render();
      window.scrollTo({top: 0, behavior: "smooth"});
    };
    filtros.appendChild(btn);
  }
  // Click en "Todos"
  filtros.querySelector("button[data-cat='']").onclick = () => {
    activeCat = "";
    renderFiltros();
    render();
    window.scrollTo({top: 0, behavior: "smooth"});
  };
}

function escapeHtml(s) {
  return String(s || "").replace(/[<>&"']/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "\\'"); }

(async () => {
  try {
    const [prods, cats] = await Promise.all([
      fetchAll("productos"),
      fetchAll("categorias"),
    ]);
    allProductos = prods;
    allCategorias = cats;
    document.getElementById("loading").style.display = "none";
    renderFiltros();
    render();
  } catch (e) {
    document.getElementById("loading").innerHTML = `
      <div style="color:#c62828">⚠ Error cargando catálogo</div>
      <div style="margin-top:8px;font-size:12px;color:#999">${escapeHtml(e.message || e)}</div>
    `;
    console.error(e);
  }
})();
</script>

</body>
</html>
