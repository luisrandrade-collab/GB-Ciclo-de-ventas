name: pre-deploy check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run pre-deploy check
        run: node scripts/check.mjs
      - name: Run despachos unit tests
        run: node scripts/test_despachos.mjs
      - name: Run menaje unit tests
        run: node scripts/test_menaje.mjs
      - name: Run merge-operational unit tests
        run: node scripts/test_merge_operational.mjs
      - name: Run ventas-anteriores unit tests
        run: node scripts/test_ventas_anteriores.mjs
      - name: Run proptotal-transporte unit tests
        run: node scripts/test_proptotal_transporte.mjs
      - name: Run dinero unit tests
        run: node scripts/test_dinero.mjs
      - name: Run drift check (fuente vs copias de test)
        run: node scripts/check_drift.mjs
